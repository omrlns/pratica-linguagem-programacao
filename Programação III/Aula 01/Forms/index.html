<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>

    <!-- DICAS IMPORTANTES -->
    <!-- * sempre use <label> com os campos, isso melhora a acessibilidade e a experiência do usuário. -->
    <!-- * campos como email, number e password ajudam a validar melhor os dados. -->
    <!-- * use required para tornar os campos obrigatórios. -->
    <!-- placeholder ajuda o usuário a entender o que deve ser preenchido. -->
    <!-- action define para onde os dados serão enviados -->
    <!-- method: define como os dados serão enviados (os mais comuns são GET e POST) -->
    <!-- para organizar melhor o formulário visualmente, usamos: <fieldset> e <legend> -->
    
    <h3> Formulário 1</h3>

    <form action="/caminho-para-enviar" method="POST">
        <!-- os campos do formulário vão aqui -->
        <!-- tipos de campos mais usados: -->
        <fieldset>
            <legend>Dados Pessoais</legend>
            <!-- texto -->
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" required> <br>
            <!-- email -->
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required> <br>
            <!-- número -->
            <label for="idade">Idade:</label>
            <input type="number" name="idade" id="number"> <br>
            <!-- senha -->
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" required>
       </fieldset>     
    </form>
    <!-- radio = escolher apenas uma opção -->
    <form action="/caminho-para-enviar" method="POST">
        <fieldset>
            <legend>Turno</legend>
            <p>Qual turno você prefere?</p>
            <input type="radio" name="turno" id="matutino" value="matutino">
            <label for="matutino">Matutino</label>
            <input type="radio" name="turno" id="matutino" value="vespertino">
            <label for="matutino">Vespertino</label>
            <input type="radio" name="turno" id="noturno" value="noturno">
            <label for="noturno">Noturno</label>
            </fieldset>
    </form>
    <!-- checkbox = escolher várias opções -->
     <form action="/caminho-para-enviar" method="POST">
        <fieldset>
            <legend>Curso</legend>
            <p>Quais cursos você tem interesse?</p>
            <input type="checkbox" name="curso" id="html" value="HTML">
            <label for="html">HTML</label>
            <input type="checkbox" name="curso" id="css" value="CSS">
            <label for="css">CSS</label>
            <input type="checkbox" name="curso" id="javascript" value="JavaScript">
            <label for="javascript">JavaScript</label>
            </fieldset>
     </form> <br>
     <button type="submit">Enviar</button>

     <h3>Formulário 2</h3>
     <fieldset>
        <legend>Inscrição ONG</legend>
        <label for="nome-completo">Nome Completo:</label>
        <input type="text" name="nome-completo" id="nome-completo">
        <label for="email">Email:</label>
        <input type="email" name="email" id="email"> <br>
        <label for="telefone">Telefone:</label>
        <input type="text" name="telefone" id="telefone" placeholder="(48) 99999-9999">
        <label for="idade">Idade:</label>
        <input type="number" name="idade" id="idade">

        <p>Qual turno você prefere?</p>
        <input type="radio" name="turno" id="matutino" value="matutino">
            <label for="matutino">Matutino</label>
            <input type="radio" name="turno" id="matutino" value="vespertino">
            <label for="matutino">Vespertino</label>
            <input type="radio" name="turno" id="noturno" value="noturno">
            <label for="noturno">Noturno</label> <br> <br>
        
        <label for="area">Área de Interesse:</label>
        <select name="area" id="area">
            <option value="" disabled selected>Selecione</option>
        </select>

        <label for="disponibilidade">Disponibilidade Semanal (Horas):</label>
        <input type="number" name="disponibilidade" id="disponibilidade">

        <p>Deixe uma Mensagem ou Comentário:</p>
        <textarea name="mensagem" id="mensagem" placeholder="Conte-nos algo sobre você!..."></textarea>

        <input type="checkbox" name="termos" id="termos">
        <label for="termos">Aceito os Termos.</label>
        
        

     </fieldset>

</body>
</html>
