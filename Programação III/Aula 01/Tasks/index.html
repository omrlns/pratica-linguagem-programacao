<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário + Regex</title>
</head>
<body>
    <h2>Atividade Prática - Formulário + Regex</h2>
    <form>
        <fieldset>
            <legend>Informações Pessoais</legend>
            <label for="fullname">Nome Completo:</label>
            <input 
            type="text" name="fullname" id="fullname"
            pattern=""
            placeholder="Marlon da Silva"
            required>
            <br>
            <label for="telefone">Telefone</label>
            <input 
            type="tel" name="telefone" id="telefone"
            pattern=""
            placeholder="(99) 99999-9999"
            required>
            <label for="birthdate">Data de Nascimento:</label>
            <input 
            type="text" name="birthdate" id="birthdate"
            pattern=""
            placeholder="09/12/2022"
            required>
            <br>
            <label for="cpf">CPF:</label>
            <input 
            type="text" name="cpf" id="cpf"
            pattern=""
            placeholder="123.456.789-12"
            required>
            <label for="rg">RG:</label>
            <input 
            type="text" name="rg" id="rg"
            pattern=""
            placeholder="1.234.567"
            required>
            <label for="blood-type">Tipo Sanguíneo:</label>
            <input 
            type="text" name="blood-type" id="blood-type"
            pattern=""
            placeholder="A+"
            required>
            <br>
            <label for="personal-email">Email:</label>
            <input 
            type="text" name="personal-email" id="personal-email"
            pattern=""
            placeholder="you@mail.com"
            required>
        </fieldset>
        <fieldset>
            <legend>Dados Bancários</legend>
            <label for="credit-card">Número do Cartão:</label>
            <input 
            type="text" name="credit-card" id="credit-card"
            pattern=""
            placeholder="1234 5678 1234 5678"
            required>
            <label for="validade">Validade:</label>
            <input 
            type="text" name="validade" id="validade"
            pattern=""
            placeholder="12/26"
            required>
            <label for="cvv">CVV:</label>
            <input 
            type="text" name="cvv" id="cvv"
            pattern=""
            placeholder=""
            required>
        </fieldset>
        <fieldset>
            <legend>Informações Juridicas</legend>
            <label for="cnpj">CNPJ:</label>
            <input 
            type="text" name="cnpj" id="cnpj"
            pattern=""
            placeholder=""
            required>
            <label for="ie">IE:</label>
            <input 
            type="text" name="ie" id="ie"
            pattern=""
            placeholder=""
            required>
            <br>
            <label for="cep">CEP:</label>
            <input 
            type="text" name="cep" id="cep"
            pattern=""
            placeholder=""
            required>
            <label for="adress">Endreço:</label>
            <input 
            type="text" name="adress" id="adress"
            pattern=""
            placeholder="Rua dos Bobos, Nº 0"
            required>
        </fieldset>
        <fieldset>
            <legend>Informações Universitárias</legend>
            <label for="matricula">Matrícula:</label>
            <input 
            type="text" name="matricula" id="matricula"
            pattern=""
            placeholder=""
            required>
            <label for="fmp-email">Email Institucional da FMP:</label>
            <input 
            type="text" name="fmp-email" id="fmp-email"
            pattern=""
            placeholder="nome@aluno.fmpsc.edu.br"        
            required>
        </fieldset>
        <fieldset>
            <legend>Informações Aleatórias</legend>
            <label for="lagitude">Lagitude:</label>
            <input 
            type="text" name="lagitude" id="lagitude"
            pattern=""
            placeholder=""
            required>
            <label for="longitude">Longitude:</label>
            <input type="text" name="longitude" id="longitude">
            <br>
            <label for="codebar">Código de Barras:</label>
            <input 
            type="text" name="codebar" id="codebar"
            pattern=""
            placeholder=""
            required>
            <br>
            <label for="idcar">Placa do Carro - Modelo Mercosul:</label>
            <input 
            type="text" name="idcar" id="idcar"
            pattern=""
            placeholder=""
            required>
            <br>
            <label for="lote">Lote de Venda - Peixes</label>
            <input 
            type="text" name="lote" id="lote"
            pattern=""
            placeholder=""
            required>
        </fieldset>
        <p>OBS: TODOS OS CAMPOS PRECISAM SER PREENCHIDOS.</p>
        <br>
        <button type="submit">Enviar Informações</button>
    </form>
</body>
</html>
